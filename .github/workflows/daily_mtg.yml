name: Daily MTG prices

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily (Scryfall regenerates bulk data overnight US time)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: daily-mtg
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only torch keeps the install small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      # The DuckDB file is carried between runs in the Actions cache. Cache entries are
      # immutable, so each run saves under a new key and restores the newest `mtg-db-*`.
      - name: Restore price database
        uses: actions/cache/restore@v4
        with:
          path: data/mtg_prices.duckdb
          key: mtg-db-${{ github.run_id }}
          restore-keys: mtg-db-

      - name: Unit tests
        run: python -m pytest -q

      - name: Backfill 90 days from MTGJSON (first run / cache miss only)
        run: python -m src.backfill --if-empty

      - name: Ingest today's Scryfall snapshot
        run: python -m src.ingest

      - name: Save price database
        uses: actions/cache/save@v4
        with:
          path: data/mtg_prices.duckdb
          key: mtg-db-${{ github.run_id }}

      - name: Detect movers and alert Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.alerts --notify

      - name: Upload database snapshot (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: mtg_prices-${{ github.run_id }}
          path: data/mtg_prices.duckdb
          retention-days: 7
