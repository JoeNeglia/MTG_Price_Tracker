[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-price-tracker"
version = "0.1.0"
description = "Zero-cost MTG price tracker with calibrated spike/drop prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "ijson>=3.2",          # streaming JSON parser for the multi-GB bulk files
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
